<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="search">
            <div class="icon" id="search-icon">(o-)</div>
            <input type="search">
        </div>
        <div class="user-info" id="user-info-1">Morgan Oakley</div>
        <div class="user-info" id="user-info-2">Hi there, Morgan Oakley (@Morgan)</div>
        <div class="header-nav">
            <button class="button" id="new-btn">New</button>
            <button class="button" id="upload-btn">Upload</button>
            <button class="button" id="share-btn">Share</button>
        </div>
      </header>
      <main class="main">
        <div class="section" id="projects">Your Project</div>
        <div class="section" id="announcements">Announcements</div>
        <div class="section" id="trending">Trending</div>
      </main>
      <aside class="sidebar">
        <div class="branding">(Logo) Dashboard</div>
        <div class="sidebar-nav">
            <ul>
                <li>Home</li>
                <li>Profile</li>
                <li>Messages</li>
                <li>History</li>
                <li>Tasks</li>
                <li>Communities</li>
            </ul>
        </div>
        <div class="sidebar-nav">
            <ul>
                <li>Settings</li>
                <li>Support</li>
                <li>Privacy</li>
            </ul>
        </div>
      </aside>
  </body>
</html>
